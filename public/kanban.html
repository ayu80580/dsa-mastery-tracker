<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Engine | Interactive Kanban Board</title>

    <!-- CUSTOM TAB FAVICON LOGO -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="/js/layout.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { obsidian: { 950: '#09090b', 900: '#121215', 800: '#27272a' } } } } }
    </script>
    <style>
        body { background: #09090b; color: #f4f4f5; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .kanban-col { min-height: 520px; background: rgba(18, 18, 21, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">
    <nav id="app-nav"></nav>
    <!-- REAL-TIME SYNC LOADER BADGE -->
    <div id="sync-loader" class="fixed bottom-6 right-6 z-50 hidden flex items-center gap-2.5 px-4 py-2.5 bg-emerald-500 text-black font-extrabold text-xs rounded-2xl shadow-xl shadow-emerald-500/20 transition-all duration-300">
        <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
        <span id="sync-text">Updating problem status...</span>
    </div>

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-40 glass-card border-b border-obsidian-800 px-6 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-xl border border-emerald-500/20">
                <i data-lucide="layers" class="w-5 h-5"></i>
            </div>
            <span class="font-black text-lg tracking-wide text-white">DSA ENGINE</span>
        </div>

        <div class="flex items-center gap-6 text-xs font-bold text-slate-400">
            <a href="/dashboard" class="hover:text-emerald-400 transition">Dashboard</a>
            <a href="/roadmaps" class="hover:text-emerald-400 transition">Roadmaps</a>
            <a href="/problems" class="hover:text-emerald-400 transition">Problems</a>
            <a href="/kanban" class="text-emerald-400 border-b-2 border-emerald-400 pb-1">Kanban</a>
            <a href="/analytics" class="hover:text-emerald-400 transition">Analytics</a>
            <a href="/ai-coach" class="hover:text-emerald-400 transition">AI Mentor</a>
        </div>
        <!-- RIGHT ACTION BUTTONS -->
        <div class="flex items-center gap-3">
            <!-- THEME SWITCH BUTTON -->
            <button onclick="toggleTheme()" class="p-2 bg-slate-200 dark:bg-obsidian-900 text-slate-700 dark:text-slate-300 rounded-xl border border-slate-300 dark:border-obsidian-800 hover:scale-105 transition flex items-center justify-center cursor-pointer" title="Toggle Theme">
                <!-- Sun Icon (Visible in Dark Mode) -->
                <i data-lucide="sun" class="w-4 h-4 text-amber-500 hidden dark:block"></i>
                <!-- Moon Icon (Visible in Light Mode) -->
                <i data-lucide="moon" class="w-4 h-4 text-indigo-600 block dark:hidden"></i>
            </button>

            <!-- LOGOUT BUTTON -->
            <button onclick="logout()" class="px-3.5 py-1.5 bg-slate-200 dark:bg-obsidian-900 text-slate-700 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white rounded-xl border border-slate-300 dark:border-obsidian-800 text-xs font-bold transition">Logout</button>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full space-y-6">
        
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-black text-white">Interactive Drag & Drop Board</h1>
                <p class="text-xs text-slate-400 mt-1">Drag problem cards across columns to update completion status in real-time</p>
            </div>

            <div class="flex items-center gap-3">
                <select id="kanban-track" onchange="loadKanban()" class="bg-obsidian-900 border border-obsidian-800 text-xs text-slate-200 font-bold px-3 py-2 rounded-xl outline-none focus:border-emerald-500">
                    <option value="all">All Tracks Aggregated</option>
                    <option value="beginner">Beginner Track</option>
                    <option value="intermediate">Intermediate Track</option>
                    <option value="advanced">Advanced Track</option>
                </select>
            </div>
        </div>

        <!-- KANBAN COLUMNS GRID -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
            
            <!-- TODO COLUMN -->
            <div class="kanban-col rounded-3xl p-4 flex flex-col space-y-3" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'Todo')">
                <div class="flex justify-between items-center pb-3 border-b border-obsidian-800">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Todo</span>
                    <span id="count-todo" class="text-xs font-mono font-bold px-2.5 py-0.5 rounded-full bg-obsidian-900 text-slate-400">0</span>
                </div>
                <div id="col-todo" class="space-y-3 flex-1 overflow-y-auto max-h-[650px] pr-1"></div>
            </div>

            <!-- HINT-SOLVED COLUMN -->
            <div class="kanban-col rounded-3xl p-4 flex flex-col space-y-3" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'Hint-solved')">
                <div class="flex justify-between items-center pb-3 border-b border-obsidian-800">
                    <span class="text-xs font-bold uppercase tracking-wider text-amber-400">Hint-Solved</span>
                    <span id="count-hint" class="text-xs font-mono font-bold px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300">0</span>
                </div>
                <div id="col-hint" class="space-y-3 flex-1 overflow-y-auto max-h-[650px] pr-1"></div>
            </div>

            <!-- SOLVED COLUMN -->
            <div class="kanban-col rounded-3xl p-4 flex flex-col space-y-3" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'Solved')">
                <div class="flex justify-between items-center pb-3 border-b border-obsidian-800">
                    <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Solved</span>
                    <span id="count-solved" class="text-xs font-mono font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300">0</span>
                </div>
                <div id="col-solved" class="space-y-3 flex-1 overflow-y-auto max-h-[650px] pr-1"></div>
            </div>

            <!-- MASTERED COLUMN -->
            <div class="kanban-col rounded-3xl p-4 flex flex-col space-y-3" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'Mastered')">
                <div class="flex justify-between items-center pb-3 border-b border-obsidian-800">
                    <span class="text-xs font-bold uppercase tracking-wider text-indigo-400">Mastered</span>
                    <span id="count-mastered" class="text-xs font-mono font-bold px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300">0</span>
                </div>
                <div id="col-mastered" class="space-y-3 flex-1 overflow-y-auto max-h-[650px] pr-1"></div>
            </div>

        </div>

    </main>

    <script>
        const jwtToken = localStorage.getItem('dsa_jwt');
        if (!jwtToken) window.location.href = '/';

        let kanbanProblems = [];

        function showLoader(msg = "Syncing update to database...") {
            const loader = document.getElementById('sync-loader');
            document.getElementById('sync-text').innerText = msg;
            loader.classList.remove('hidden');
        }

        function hideLoader() {
            setTimeout(() => {
                document.getElementById('sync-loader').classList.add('hidden');
            }, 400);
        }

        function loadKanban() {
            showLoader("Loading Kanban board...");
            const track = document.getElementById('kanban-track').value;
            fetch(`/api/problems?track=${track}`, {
                headers: { 'Authorization': `Bearer ${jwtToken}` }
            })
            .then(r => r.json())
            .then(data => {
                kanbanProblems = Array.isArray(data) ? data : [];
                renderBoard();
                hideLoader();
            })
            .catch(err => {
                console.error("Kanban load error:", err);
                hideLoader();
            });
        }

        function renderBoard() {
            const cols = { 'Todo': 'todo', 'Hint-solved': 'hint', 'Solved': 'solved', 'Mastered': 'mastered' };
            
            Object.keys(cols).forEach(status => {
                const list = kanbanProblems.filter(p => p.status === status);
                document.getElementById(`count-${cols[status]}`).innerText = list.length;
                
                const container = document.getElementById(`col-${cols[status]}`);
                if (list.length === 0) {
                    container.innerHTML = `<p class="text-[11px] text-slate-600 text-center py-8 italic">No cards here</p>`;
                    return;
                }

                container.innerHTML = list.map(p => `
                    <div draggable="true" ondragstart="handleDragStart(event, ${p.id})" class="glass-card p-4 rounded-2xl space-y-3 cursor-grab active:cursor-grabbing hover:border-emerald-500/40 transition">
                        <div class="flex justify-between items-start gap-2">
                            <span class="font-bold text-xs text-white leading-snug">${p.name}</span>
                            <span class="px-2 py-0.5 rounded text-[9px] font-bold shrink-0 ${
                                p.difficulty === 'Easy' ? 'bg-cyan-500/20 text-cyan-300' :
                                p.difficulty === 'Medium' ? 'bg-amber-500/20 text-amber-300' : 'bg-rose-500/20 text-rose-300'
                            }">${p.difficulty}</span>
                        </div>
                        <p class="text-[10px] text-slate-400 font-mono">${p.topic}</p>
                        <div class="flex justify-between items-center text-[10px] text-slate-400 pt-2 border-t border-obsidian-800">
                            <span class="font-mono">Rev: ${p.revisions || 0}/5</span>
                            <a href="${p.url || '#'}" target="_blank" rel="noopener noreferrer" class="text-emerald-400 font-bold hover:underline inline-flex items-center gap-1">
                                <span>Jump</span>
                                <i data-lucide="external-link" class="w-3 h-3"></i>
                            </a>
                        </div>
                    </div>
                `).join('');
            });
            lucide.createIcons();
        }

        function allowDrop(e) { e.preventDefault(); }
        function handleDragStart(e, id) { e.dataTransfer.setData("text/plain", id); }

        function handleDrop(e, targetStatus) {
            e.preventDefault();
            const id = parseInt(e.dataTransfer.getData("text/plain"), 10);
            if (!id) return;

            const prob = kanbanProblems.find(p => p.id === id);
            if (!prob || prob.status === targetStatus) return;

            showLoader(`Moving '${prob.name}' to ${targetStatus}...`);

            prob.status = targetStatus;
            if (targetStatus === 'Solved' || targetStatus === 'Mastered') {
                prob.solved_date = new Date().toISOString().split('T')[0];
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            fetch(`/api/progress/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${jwtToken}` },
                body: JSON.stringify(prob)
            })
            .then(r => r.json())
            .then(() => {
                renderBoard();
                hideLoader();
            })
            .catch(err => {
                console.error("Progress update failed:", err);
                hideLoader();
            });
        }

        function logout() { localStorage.removeItem('dsa_jwt'); window.location.href = '/'; }

        loadKanban();
    </script>
</body>
</html>
