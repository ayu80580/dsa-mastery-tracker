<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Engine | Master Problems</title>

    <!-- CUSTOM TAB FAVICON LOGO -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/layout.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { obsidian: { 950: '#09090b', 900: '#121215', 800: '#27272a' } } } } }
    </script>
    <style>
        body { background: #09090b; color: #f4f4f5; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav id="app-nav"></nav>

    <!-- GLOBAL NAVBAR -->
    <nav class="sticky top-0 z-50 glass-card border-b border-obsidian-800 px-6 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-xl border border-emerald-500/20">
                <i data-lucide="layers" class="w-5 h-5"></i>
            </div>
            <span class="font-black text-lg tracking-wide text-white">DSA ENGINE</span>
        </div>

        <div class="flex items-center gap-6 text-xs font-bold text-slate-400">
            <a href="/dashboard" class="hover:text-emerald-400 transition">Dashboard</a>
            <a href="/roadmaps" class="hover:text-emerald-400 transition">Roadmaps</a>
            <a href="/problems" class="text-emerald-400 border-b-2 border-emerald-400 pb-1">Problems</a>
            <a href="/kanban" class="hover:text-emerald-400 transition">Kanban</a>
            <a href="/analytics" class="hover:text-emerald-400 transition">Analytics</a>
            <a href="/ai-coach" class="hover:text-emerald-400 transition">AI Mentor</a>
        </div>

        <button onclick="logout()" class="px-3 py-1.5 bg-obsidian-900 text-slate-400 rounded-xl border border-obsidian-800 hover:text-white text-xs font-bold">Logout</button>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full space-y-6">
        
        <!-- HEADER & TRACK SELECTOR TABS -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-black text-white">Master Problem Workspace</h1>
                <p class="text-xs text-slate-400 mt-1">Select a track level to view problem lists and update status</p>
            </div>

            <!-- DEDICATED TRACK SWITCHER TABS -->
            <div class="flex items-center gap-2 bg-obsidian-900 p-1.5 rounded-2xl border border-obsidian-800">
                <button onclick="switchTrack('beginner')" id="tab-beginner" class="px-4 py-2 rounded-xl text-xs font-bold transition">Beginner</button>
                <button onclick="switchTrack('intermediate')" id="tab-intermediate" class="px-4 py-2 rounded-xl text-xs font-bold transition">Intermediate</button>
                <button onclick="switchTrack('advanced')" id="tab-advanced" class="px-4 py-2 rounded-xl text-xs font-bold transition">Advanced</button>
            </div>
        </div>

        <!-- SEARCH BAR -->
        <div class="flex justify-between items-center">
            <input type="text" id="search" oninput="renderTable()" placeholder="Search problem or topic..." class="bg-obsidian-900 border border-obsidian-800 text-xs px-4 py-2.5 rounded-xl text-slate-200 outline-none w-72 focus:border-emerald-500">
            <span id="problem-count" class="text-xs font-mono text-slate-400">0 Problems</span>
        </div>

        <!-- PROBLEMS TABLE -->
        <div class="glass-card rounded-3xl overflow-hidden border border-obsidian-800">
            <table class="w-full text-left text-xs">
                <thead class="bg-obsidian-900 text-slate-400 font-bold border-b border-obsidian-800 uppercase">
                    <tr>
                        <th class="p-4 w-12 text-center font-mono">#</th>
                        <th class="p-4">Problem Name</th>
                        <th class="p-4">Topic</th>
                        <th class="p-4">Difficulty</th>
                        <th class="p-4">Status</th>
                        <th class="p-4">Time (M)</th>
                        <th class="p-4">Revisions</th>
                        <th class="p-4 text-center">LeetCode</th>
                    </tr>
                </thead>
                <tbody id="problems-body" class="divide-y divide-obsidian-800/80"></tbody>
            </table>
        </div>
    </main>

    <script>
        const jwtToken = localStorage.getItem('dsa_jwt');
        if (!jwtToken) window.location.href = '/';

        let problems = [];
        let currentTrack = new URLSearchParams(window.location.search).get('track') || 'beginner';

        function updateTabHighlight() {
            ['beginner', 'intermediate', 'advanced'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (btn) {
                    if (t === currentTrack) {
                        btn.className = "px-4 py-2 rounded-xl text-xs font-bold transition bg-emerald-500 text-black shadow-lg shadow-emerald-500/20";
                    } else {
                        btn.className = "px-4 py-2 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white";
                    }
                }
            });
        }

        function switchTrack(track) {
            currentTrack = track;
            window.history.pushState({}, '', `/problems?track=${track}`);
            updateTabHighlight();
            loadProblems();
        }

        function loadProblems() {
            updateTabHighlight();
            fetch(`/api/problems?track=${currentTrack}`, {
                headers: { 'Authorization': `Bearer ${jwtToken}` }
            })
            .then(res => {
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem('dsa_jwt');
                    window.location.href = '/';
                    return null;
                }
                return res.json();
            })
            .then(data => {
                if (!data) return;
                problems = Array.isArray(data) ? data : [];
                renderTable();
            })
            .catch(err => {
                console.error("Error loading problems:", err);
                problems = [];
                renderTable();
            });
        }

        function renderTable() {
            const query = (document.getElementById('search').value || '').toLowerCase();
            const filtered = Array.isArray(problems) ? problems.filter(p => 
                (p.name && p.name.toLowerCase().includes(query)) || 
                (p.topic && p.topic.toLowerCase().includes(query))
            ) : [];

            document.getElementById('problem-count').innerText = `${filtered.length} Problems`;

            const tbody = document.getElementById('problems-body');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-slate-500">No problems found for '${currentTrack}' track. Ensure Excel files are seeded.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(p => `
                <tr class="hover:bg-obsidian-900/50 transition">
                    <td class="p-4 text-center font-mono text-slate-500">${p.id}</td>
                    <td class="p-4 font-bold text-white">${p.name}</td>
                    <td class="p-4 text-slate-400">${p.topic}</td>
                    <td class="p-4">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${
                            p.difficulty === 'Easy' ? 'bg-cyan-500/20 text-cyan-300' :
                            p.difficulty === 'Medium' ? 'bg-amber-500/20 text-amber-300' : 'bg-rose-500/20 text-rose-300'
                        }">${p.difficulty}</span>
                    </td>
                    <td class="p-4">
                        <select onchange="updateStatus(${p.id}, this.value)" class="bg-obsidian-950 border border-obsidian-800 rounded-lg px-2.5 py-1 text-slate-200 text-xs outline-none">
                            <option value="Todo" ${p.status === 'Todo' ? 'selected' : ''}>Todo</option>
                            <option value="Hint-solved" ${p.status === 'Hint-solved' ? 'selected' : ''}>Hint-solved</option>
                            <option value="Solved" ${p.status === 'Solved' ? 'selected' : ''}>Solved</option>
                            <option value="Mastered" ${p.status === 'Mastered' ? 'selected' : ''}>Mastered</option>
                        </select>
                    </td>
                    <td class="p-4 font-mono text-cyan-300">${p.time_min || 0}m</td>
                    <td class="p-4 font-mono text-emerald-400">${p.revisions || 0}/5</td>
                    <td class="p-4 text-center">
                        <a href="${p.url || '#'}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500 hover:text-black font-extrabold text-xs transition-all whitespace-nowrap shadow-sm group">
                            <span>Jump</span>
                            <i data-lucide="external-link" class="w-3.5 h-3.5 shrink-0 transition-transform group-hover:translate-x-0.5"></i>
                        </a>
                    </td>
                </tr>
            `).join('');

            // Render Lucide icons properly after updating innerHTML
            lucide.createIcons();
        }

        function updateStatus(id, status) {
            fetch(`/api/progress/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${jwtToken}` },
                body: JSON.stringify({ status })
            });
        }

        function logout() {
            localStorage.removeItem('dsa_jwt');
            window.location.href = '/';
        }

        loadProblems();
    </script>
</body>
</html>
